
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Birthday Cake for my baby boo boo 🎂</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap"
      rel="stylesheet"
    />

    <style>
      #mainTitle {
        font-size: 32px;
        font-family: "Pixelify Sans", sans-serif;
        margin-bottom: 8px;
      }

      #subTitle {
        font-size: 18px;
        font-family: "Pixelify Sans", sans-serif;
        color: #555;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div id="birthdayText"></div>

      <div class="cake-container">
        <div class="cake" id="cake"></div>
      </div>
    </div>

    <script>
      // Read URL parameters
      const params = new URLSearchParams(window.location.search);
      const name = params.get("name") || "Friend";

      let candleCount = parseInt(params.get("candles"), 10) || 4;
      candleCount = Math.min(Math.max(candleCount, 1), 30);

      const birthdayText = document.getElementById("birthdayText");

      // Create birthday title
      const mainTitle = document.createElement("div");
      mainTitle.id = "mainTitle";
      mainTitle.textContent = `Happy Birthday to my baby boo boo ❤️`;

      const subTitle = document.createElement("div");
      subTitle.id = "subTitle";
      subTitle.textContent = "Make a wish and blow the candles.";

      birthdayText.append(mainTitle, subTitle);

      const cake = document.getElementById("cake");

      const colors = [
        "green-candle",
        "purple-candle",
        "blue-candle",
        "yellow-candle",
      ];

      const CAKE_VISUAL_WIDTH = 35;

      // Create candles
      function createCandles(count) {
        cake.innerHTML = "";

        const CANDLE_VISUAL_WIDTH = 2;
        const availableWidth = CAKE_VISUAL_WIDTH;
        const candlesPerRow = 6;
        const shiftAmount = 4;

        for (let i = 0; i < count; i++) {
          const candle = document.createElement("div");
          candle.classList.add("candle");

          const colorClass =
            colors[Math.floor(Math.random() * colors.length)];

          candle.classList.add(colorClass);

          const row = Math.floor(i / candlesPerRow);
          const col = i % candlesPerRow;

          const totalCandlesInRow = Math.min(
            candlesPerRow,
            count - row * candlesPerRow
          );

          const rowSpacing = availableWidth / (totalCandlesInRow + 1);

          const leftBase =
            rowSpacing * (col + 1) - CANDLE_VISUAL_WIDTH / 2 + 5;

          const rowShift = row % 2 === 0 ? 0 : shiftAmount;

          candle.style.position = "absolute";
          candle.style.top = `${10 + row * 3}px`;
          candle.style.left = `${leftBase - rowShift + 4}px`;

          cake.appendChild(candle);
        }
      }

      createCandles(candleCount);

      // =================================
      // MICROPHONE / BLOW DETECTION
      // =================================

      async function startMicDetection() {
        if (
          !navigator.mediaDevices ||
          !navigator.mediaDevices.getUserMedia
        ) {
          console.error(
            "Microphone access requires HTTPS or localhost."
          );
          return;
        }

        let stream;

        try {
          stream = await navigator.mediaDevices.getUserMedia({
            audio: {
              echoCancellation: false,
              noiseSuppression: false,
              autoGainControl: false,
            },
          });

          const AudioContextClass =
            window.AudioContext || window.webkitAudioContext;

          if (!AudioContextClass) {
            throw new Error("Web Audio API is not supported.");
          }

          const audioContext = new AudioContextClass();

          if (audioContext.state === "suspended") {
            await audioContext.resume();
          }

          const source =
            audioContext.createMediaStreamSource(stream);

          const analyser = audioContext.createAnalyser();

          analyser.fftSize = 1024;
          analyser.smoothingTimeConstant = 0.2;

          source.connect(analyser);

          const dataArray = new Uint8Array(analyser.fftSize);

          let blown = false;
          let blowFrames = 0;

          // Microphone sensitivity
          const BLOW_RMS_THRESHOLD = 0.07;

          // Required consecutive loud frames
          const REQUIRED_BLOW_FRAMES = 7;

          function detectBlow() {
            if (blown) return;

            analyser.getByteTimeDomainData(dataArray);

            let sumOfSquares = 0;

            for (let i = 0; i < dataArray.length; i++) {
              const sample = (dataArray[i] - 128) / 128;

              sumOfSquares += sample * sample;
            }

            const rms = Math.sqrt(
              sumOfSquares / dataArray.length
            );

            if (rms > BLOW_RMS_THRESHOLD) {
              blowFrames++;
            } else {
              blowFrames = 0;
            }

            if (
              blowFrames >= REQUIRED_BLOW_FRAMES &&
              !blown
            ) {
              blown = true;

              blowOutCandles();

              // Stop microphone after blowing out the candles
              stream.getTracks().forEach((track) => {
                track.stop();
              });

              audioContext.close();

              return;
            }

            requestAnimationFrame(detectBlow);
          }

          detectBlow();

        } catch (err) {
          console.error("Mic access error:", err);

          if (stream) {
            stream.getTracks().forEach((track) => {
              track.stop();
            });
          }
        }
      }

      // =================================
      // BLOW OUT CANDLES
      // =================================

      function blowOutCandles() {
        const candles = document.querySelectorAll(".candle");

        candles.forEach((candle) => {
          const delay = Math.random() * 1000;

          setTimeout(() => {
            colors.forEach((color) => {
              if (candle.classList.contains(color)) {
                candle.classList.add("blown");
              }
            });
          }, delay);
        });

        // Update subtitle
        setTimeout(() => {
          const subtitleElement =
            document.getElementById("subTitle");

          if (subtitleElement) {
            subtitleElement.textContent =
              "Hihi. Wishing you the happiest birthday my one and only love ❤️🎉";
          }
        }, 1200);
      }

      // Start microphone detection
      startMicDetection();
    </script>
  </body>
</html>
